[project]
name = "titanic-summary"
version = "0.1.0"
description = "Summarize synthetic Titanic passenger CSV records"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.14.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
